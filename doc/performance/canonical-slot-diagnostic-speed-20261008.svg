<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="446" viewBox="0 0 1140 446">
<style>text{font-family:Arial,sans-serif;fill:#223047} .title{font-size:20px;font-weight:bold} .small{font-size:13px}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="24" y="30" class="title">Canonical slot diagnostic speed vs accepted XLang3 control</text>
<text x="24" y="55" class="small">Seven alternating process pairs; every neutral/slower case retained. These are not official pyperformance scores.</text>
<line x1="689.46" x2="689.46" y1="78" y2="402" stroke="#64748b" stroke-dasharray="5 4"/>
<text x="689.46" y="76" class="small" text-anchor="middle">1× reference</text>
<text x="303" y="114" text-anchor="end" class="small">R3 own_slot</text>
<rect x="315" y="98" width="671.30" height="23" rx="2" fill="#c2410c"/>
<text x="994.30" y="114" class="small">1.793×</text>
<text x="303" y="150" text-anchor="end" class="small">R3 inherited_slot</text>
<rect x="315" y="134" width="336.49" height="23" rx="2" fill="#c2410c"/>
<text x="659.49" y="150" class="small">0.899×</text>
<text x="303" y="186" text-anchor="end" class="small">R3 ordinary_attr</text>
<rect x="315" y="170" width="350.29" height="23" rx="2" fill="#c2410c"/>
<text x="673.29" y="186" class="small">0.935×</text>
<text x="303" y="222" text-anchor="end" class="small">R3 sqlglot_v2_parse</text>
<rect x="315" y="206" width="433.75" height="23" rx="2" fill="#c2410c"/>
<text x="756.75" y="222" class="small">1.158×</text>
<text x="303" y="258" text-anchor="end" class="small">R4 own_slot</text>
<rect x="315" y="242" width="670.88" height="23" rx="2" fill="#2563eb"/>
<text x="993.88" y="258" class="small">1.792×</text>
<text x="303" y="294" text-anchor="end" class="small">R4 inherited_slot</text>
<rect x="315" y="278" width="361.20" height="23" rx="2" fill="#2563eb"/>
<text x="684.20" y="294" class="small">0.965×</text>
<text x="303" y="330" text-anchor="end" class="small">R4 ordinary_attr</text>
<rect x="315" y="314" width="351.17" height="23" rx="2" fill="#2563eb"/>
<text x="674.17" y="330" class="small">0.938×</text>
<text x="303" y="366" text-anchor="end" class="small">R4 sqlglot_v2_parse</text>
<rect x="315" y="350" width="427.30" height="23" rx="2" fill="#2563eb"/>
<text x="750.30" y="366" class="small">1.141×</text>
<text x="24" y="430" class="small">Longer bars mean faster. Above 1× is faster than the named reference; below 1× is slower.</text></svg>
