<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="302" viewBox="0 0 1140 302">
<style>text{font-family:Arial,sans-serif;fill:#223047} .title{font-size:20px;font-weight:bold} .small{font-size:13px}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="24" y="30" class="title">Inherited slot diagnostic speed vs accepted R4 control</text>
<text x="24" y="55" class="small">Seven alternating process pairs; unchanged workloads; all four cases retained; diagnostic only.</text>
<line x1="649.78" x2="649.78" y1="78" y2="258" stroke="#64748b" stroke-dasharray="5 4"/>
<text x="649.78" y="76" class="small" text-anchor="middle">1× reference</text>
<text x="303" y="114" text-anchor="end" class="small">own_slot</text>
<rect x="315" y="98" width="357.78" height="23" rx="2" fill="#2563eb"/>
<text x="680.78" y="114" class="small">1.069×</text>
<text x="303" y="150" text-anchor="end" class="small">inherited_slot</text>
<rect x="315" y="134" width="671.30" height="23" rx="2" fill="#2563eb"/>
<text x="994.30" y="150" class="small">2.005×</text>
<text x="303" y="186" text-anchor="end" class="small">ordinary_attr</text>
<rect x="315" y="170" width="367.90" height="23" rx="2" fill="#2563eb"/>
<text x="690.90" y="186" class="small">1.099×</text>
<text x="303" y="222" text-anchor="end" class="small">sqlglot_v2_parse</text>
<rect x="315" y="206" width="339.72" height="23" rx="2" fill="#2563eb"/>
<text x="662.72" y="222" class="small">1.015×</text>
<text x="24" y="286" class="small">Longer bars mean faster. Above 1× is faster than the named reference; below 1× is slower.</text></svg>
