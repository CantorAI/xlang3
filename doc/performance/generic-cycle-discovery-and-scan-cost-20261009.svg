<svg xmlns="http://www.w3.org/2000/svg" width="880" height="455" viewBox="0 0 880 455" role="img" aria-labelledby="title desc">
<title id="title">GC repair experiments: elapsed milliseconds, lower is faster</title>
<desc id="desc">Separate fast runs. CPython 3.14.7 reference is from the R4 run. R2, R3 and R4 all fail the fixed gate; no whole-suite win is claimed.</desc>
<rect width="880" height="455" fill="white"/>
<g font-family="Arial,sans-serif" font-size="14" fill="#182b43">
<text x="24" y="28" font-size="19" font-weight="bold">GC repair experiments — elapsed time (lower is faster)</text>
<text x="24" y="51">Directional fast runs; engine candidates remain uncommitted.</text>
<text x="24" y="94" font-weight="bold">create_gc_cycles</text>
<text x="24" y="125">CPython 3.14.7 (R4)</text>
<rect x="210" y="109" width="101.9963" height="20" fill="#64748b"/>
<text x="319.9963" y="125">1.500 ms</text>
<text x="24" y="154">XLang3 R2</text>
<rect x="210" y="138" width="226.8658" height="20" fill="#d97706"/>
<text x="444.8658" y="154">3.336 ms</text>
<text x="24" y="183">XLang3 R3</text>
<rect x="210" y="167" width="224.4752" height="20" fill="#2563eb"/>
<text x="442.4752" y="183">3.301 ms</text>
<text x="24" y="212">XLang3 R4</text>
<rect x="210" y="196" width="207.4433" height="20" fill="#0d9488"/>
<text x="425.4433" y="212">3.051 ms</text>
<text x="24" y="257" font-weight="bold">gc_traversal</text>
<text x="24" y="288">CPython 3.14.7 (R4)</text>
<rect x="210" y="272" width="158.5263" height="20" fill="#64748b"/>
<text x="376.5263" y="288">2.331 ms</text>
<text x="24" y="317">XLang3 R2</text>
<rect x="210" y="301" width="482.7352" height="20" fill="#d97706"/>
<text x="700.7352" y="317">7.099 ms</text>
<text x="24" y="346">XLang3 R3</text>
<rect x="210" y="330" width="281.6941" height="20" fill="#2563eb"/>
<text x="499.6941" y="346">4.143 ms</text>
<text x="24" y="375">XLang3 R4</text>
<rect x="210" y="359" width="212.5090" height="20" fill="#0d9488"/>
<text x="430.5090" y="375">3.125 ms</text>
<text x="24" y="423">R2/R3/R4 failed the unchanged gate. These rows do not update the full97 aggregate.</text>
</g></svg>
